# Local dev infrastructure. `docker compose up -d db` is all you need to run the API from the CLI/IDE.
# `docker compose --profile full up --build` also runs the API in a container (Development environment).
services:
  db:
    image: postgres:16-alpine
    container_name: cafepos-db
    environment:
      POSTGRES_USER: cafepos
      POSTGRES_PASSWORD: cafepos_dev_pw   # local dev only
      POSTGRES_DB: cafepos
    ports:
      - "5433:5432"
    volumes:
      - cafepos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafepos -d cafepos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/CafePos.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=cafepos;Username=cafepos;Password=cafepos_dev_pw
    ports:
      - "5080:8080"

volumes:
  cafepos-pgdata:
