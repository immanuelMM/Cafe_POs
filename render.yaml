# Render Blueprint for the Cafe POS: ONE Docker web service (API + the built SPA, deploy/Dockerfile) and a Postgres database.
# Guide: docs/deployment.md ("Render"). Free plan now; to go paid see "Upgrading to paid" there.
#
# Why one service: the SPA and the API share one origin, so the SameSite=Lax refresh cookie is sent, and the API sees the real
# client IP through Render's load balancer only (no second proxy that would hide visitors behind one address). No URL is
# hard-coded anywhere; whatever name/URL Render assigns just works.

databases:
  - name: cafe-pos-db
    plan: free                  # free DBs expire after 30 days (14 days grace), 1 GB
    postgresMajorVersion: "16"  # keep major 16 (cannot be changed after creation)
    databaseName: cafepos
    user: cafepos
    region: oregon
    ipAllowList: []             # internal connections only; no access from the internet (see the guide to allow your /32 temporarily)

services:
  - type: web
    name: cafe-pos
    runtime: docker
    plan: free                  # the whole app (page included) sleeps after 15 min idle; ~1 min cold start
    region: oregon              # same region as the database so the internal URL works
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .            # repo root: the image builds both backend/ and frontend/
    healthCheckPath: /health/live   # liveness only: a DB hiccup must not make Render restart the app
    autoDeployTrigger: checksPass   # deploy only after GitHub CI passes
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - deploy/**
        - .dockerignore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # postgresql:// URL; the API parses it (SSL required, GSS disabled by default). Used because ConnectionStrings__Default is unset.
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-pos-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      # Free plan: apply migrations at startup (retries until the DB answers). Paid: set "false" and use a preDeployCommand.
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Database__SeedDevData
        value: "false"
      # Forwarded headers: TLS ends at Render's load balancer, the only proxy in front of the container. Trust private ranges only
      # (the container is not reachable from the internet). Confirm after the first deploy (guide); never add a public/CDN range.
      - key: ForwardedHeaders__KnownNetworks__0
        value: 10.0.0.0/8
      - key: ForwardedHeaders__KnownNetworks__1
        value: 172.16.0.0/12
      - key: ForwardedHeaders__KnownNetworks__2
        value: 192.168.0.0/16
      - key: ForwardedHeaders__KnownNetworks__3
        value: 100.64.0.0/10
      - key: ForwardedHeaders__KnownNetworks__4
        value: fc00::/7
      - key: ForwardedHeaders__ForwardLimit
        value: "1"
      # First owner: prompted in the dashboard at Blueprint creation (never committed). REMOVE after the first login.
      - key: Bootstrap__OwnerEmail
        sync: false
      - key: Bootstrap__OwnerPassword
        sync: false
      - key: Bootstrap__OwnerName
        sync: false
      - key: Bootstrap__LocationName
        sync: false
      - key: Bootstrap__LocationTimeZone
        sync: false
      - key: Bootstrap__LocationVatRatePercent
        sync: false
